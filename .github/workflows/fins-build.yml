name: FINS Plugin CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: osrf/ros:humble-desktop

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Basic Tools
        run: |
          apt update
          apt install -y curl git sudo jq ninja-build software-properties-common bc wget

      - name: Cache Fins-SDK
        id: cache-fins-sdk
        uses: actions/cache@v4
        with:
          path: /opt/FineVision
          key: fins-sdk-v2-dev-${{ runner.os }}

      - name: Install Fins-SDK
        if: steps.cache-fins-sdk.outputs.cache-hit != 'true'
        run: |
          cd /opt
          git clone --depth 1 -b "V2(dev)" --recursive --shallow-submodules https://gitee.com/fins-robotics/FineVision

      - name: Install Fins-CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/Han-Yu-Meng/fins-cli/main/install.sh | sudo bash || true
          
          mkdir -p /github/home/.fins
          cp -r /root/.fins/* /github/home/.fins/ || true

      - name: Setup FINS Workspace
        run: |
          # 1. 启动后台守护进程 (加上 nohup 确保稳定)
          mkdir -p /github/home/.fins/logs
          nohup finsd > /github/home/.fins/logs/finsd_boot.log 2>&1 &
          
          # 2. 等待 finsd 完全启动（增加到 8 秒，确保 API 准备就绪）
          sleep 8
          
          # 3. 核心修正：使用环境变量进入代码目录
          cd ${{ github.workspace }}
          
          # 4. 注册工作区
          fins workspace add ci_robot
          fins workspace list

      - name: Solve Dependencies
        run: |
          source /opt/ros/humble/setup.bash
          cd ${{ github.workspace }}
          sudo fins dep solve vision

      - name: Build Plugins
        run: |
          source /opt/ros/humble/setup.bash
          cd ${{ github.workspace }}
          fins build --all

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fins-plugins
          path: /github/home/.fins/install/